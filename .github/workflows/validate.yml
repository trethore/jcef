name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m py_compile tools/*.py tools/dev/*.py

      - name: Check Ant project syntax
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('build.xml')"

      - name: Check shell syntax
        run: git ls-files -z '*.sh' | xargs -0 -r -n1 bash -n

      - name: Check Markdown links
        run: python tools/dev/check_markdown_links.py

      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
